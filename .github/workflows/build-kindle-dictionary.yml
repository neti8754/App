name: Build expanded English-Hebrew Kindle dictionary

on:
  push:
    branches:
      - temp/kindle-hebrew-dictionary-20261009
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dictionary:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install KindleGen
        shell: pwsh
        run: |
          choco install kindlegen --version=2.9.0.20210511 -y --no-progress
          kindlegen.exe -version

      - name: Prepare Python
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml

      - name: Build source and MOBI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-dict | Out-Null
          python tools/build_dictionary.py
          kindlegen.exe build-dict/dictionary.opf -o build-dict/English-Hebrew-Expanded.mobi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path build-dict/English-Hebrew-Expanded.mobi)) { throw "MOBI was not produced" }

      - name: Validate MOBI structure
        shell: pwsh
        run: |
          python tools/validate_mobi.py build-dict/English-Hebrew-Expanded.mobi

      - name: Upload dictionary
        uses: actions/upload-artifact@v4
        with:
          name: English-Hebrew-Expanded-Kindle
          path: |
            build-dict/English-Hebrew-Expanded.mobi
            build-dict/BUILD-REPORT.txt
          if-no-files-found: error
          retention-days: 7
